spring.application.name=candidate-management
server.port=5001

# Database connection. Set DB_USERNAME and DB_PASSWORD in your environment,
# or replace the defaults locally. Do not commit real passwords to Git.
spring.datasource.url=jdbc:mysql://localhost:3306/candidate_db
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# Development setting. We will discuss Flyway migrations before final submission.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Helpful while developing; we can tune logging later.
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
